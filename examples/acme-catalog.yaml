---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: nopcommerce-platform
  description: nopCommerce storefront monolith — hero demo entity
  tags:
    - dotnet
    - ecommerce
    - cursor-ready
  annotations:
    gitlab.com/project-slug: __DEMO_GITLAB_GROUP__/nopcommerce
    jira.com/project-key: NOP
    backstage.io/techdocs-ref: dir:../../examples/docs/nopcommerce-platform
  links:
    - url: https://gitlab.com/__DEMO_GITLAB_GROUP__/nopcommerce
      title: GitLab Repo
      icon: catalog
    - url: https://builders180.atlassian.net/browse/NOP
      title: Jira Board
      icon: dashboard
    - url: https://grafana.example.com/d/nopcommerce
      title: Grafana Dashboard
      icon: dashboard
    - url: https://runbooks.example.com/nopcommerce
      title: Runbook
      icon: docs
spec:
  type: website
  lifecycle: production
  owner: group:default/ecommerce-team
  system: ecommerce
  dependsOn:
    - component:default/tax-service
    - component:default/auth-service
  consumesApis:
    - tax-api
    - auth-api
    - payments-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tax-service
  description: Tax calculation service (catalog sub-component of nopCommerce monorepo)
  tags:
    - dotnet
    - tax
  annotations:
    gitlab.com/project-slug: __DEMO_GITLAB_GROUP__/nopcommerce
    backstage.io/source-location: url:https://gitlab.com/__DEMO_GITLAB_GROUP__/nopcommerce/-/tree/develop/services/tax-service
    jira.com/jql: project = NOP AND summary ~ "tax"
  links:
    - url: https://gitlab.com/__DEMO_GITLAB_GROUP__/nopcommerce/-/tree/cursor/tax-service-node-migration-203e
      title: Migration Branch
      icon: catalog
spec:
  type: service
  lifecycle: production
  owner: group:default/ecommerce-team
  system: ecommerce
  subcomponentOf: component:default/nopcommerce-platform
  providesApis:
    - tax-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payments-service
  description: Golden-path payment processing microservice (Flow 2 fallback)
  tags:
    - golden-path
    - payments
    - cursor-ready
  annotations:
    gitlab.com/project-slug: __DEMO_GITLAB_GROUP__/payments-service
    jira.com/project-key: NOP
  links:
    - url: https://gitlab.com/__DEMO_GITLAB_GROUP__/payments-service
      title: GitLab Repo
      icon: catalog
    - url: https://builders180.atlassian.net/browse/NOP
      title: Jira Board
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: group:default/payments-team
  system: payments
  dependsOn:
    - component:default/auth-service
    - component:default/ledger-service
    - resource:default/payments-db
  consumesApis:
    - auth-api
---
apiVersion: backstage.io/v1alpha1
