apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payments-api
  description: REST API for payment processing
  links:
    - url: https://grafana.example.com/d/payments-api
      title: Grafana Dashboard
      icon: dashboard
spec:
  type: openapi
  lifecycle: production
  owner: group:default/payments-team
  system: payments
  definition: |
    openapi: "3.0.0"
    info:
      title: Payments API
      version: "1.0.0"
    paths:
      /payments:
        post:
          summary: Create a payment
---
apiVersion: backstage.io/v1alpha1
kind: API
