apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: new-microservice
  title: New OneDev Service (Golden Path)
  description: OneDev golden-path service with Tru Guardrails (OneTru + FCRA) baked in as Cursor rules
  tags:
    - golden-path
    - cursor-ready
    - onedev
    - tru-guardrails
    - techdocs
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - owner
        - stack
        - cloud
        - jurisdiction
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component (e.g. payments-service)
          ui:autofocus: true
        owner:
          title: Owner
          type: string
          description: Catalog owner entity ref (e.g. group:default/platform-team)
          default: group:default/platform-team
        stack:
          title: Stack
          type: string
          description: Primary runtime stack (node-ts scaffolded for live demo)
          enum:
            - node-ts
            - python
            - go
          default: node-ts
        cloud:
          title: Target cloud
          type: string
          description: OneDev target cloud — governance travels with the service across clouds
          enum:
            - aws
            - gcp
            - private
          enumNames:
            - AWS
            - GCP
            - Private Cloud
          default: gcp
        jurisdiction:
          title: Data jurisdiction
          type: string
          description: Consumer-data jurisdiction — sets data residency and cross-jurisdiction guardrails
          enum:
            - us
            - emea
            - apac
          enumNames:
            - US (FCRA)
            - EMEA (GDPR)
            - APAC
          default: us
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - gitlab.com

  steps:
    - id: fetch-base
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          stack: ${{ parameters.stack }}
          cloud: ${{ parameters.cloud }}
          jurisdiction: ${{ parameters.jurisdiction }}

    - id: publish
      name: Publish
      action: publish:gitlab
      input:
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        settings:
          description: OneDev golden-path service ${{ parameters.name }} (${{ parameters.cloud }}, ${{ parameters.jurisdiction }})

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
